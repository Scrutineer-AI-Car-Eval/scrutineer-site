<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scrutineer</title>
<meta name="description" content="Scrutineer checks a used-car listing before you buy.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #101010;
    --muted: #6b6b6b;
    --rule: #e4e4e4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0d;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --rule: #262626;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 34rem; width: 100%; }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(2rem, 8vw, 3rem);
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  p { margin: 0 0 20px; max-width: 30rem; }
  .muted { color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0 20px; }
  footer { font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Scrutineer</h1>
  <p>An iOS app that checks a used-car listing before you buy it.</p>
  <p class="muted">The site is being built. Nothing to see here yet.</p>
  <hr>
  <footer>usescrutineer.com</footer>
</main>
</body>
</html>
