<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scrutineer</title>
<meta name="description" content="Scrutineer checks a used-car listing before you buy.">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  main { max-width: 34rem; width: 100%; }
  h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -0.02em; font-weight: 600; }
  p { margin: 0 0 20px; max-width: 30rem; }
  .muted { color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0 20px; }
  .links { font-size: 15px; color: var(--muted); }
  .links a { color: var(--muted); text-underline-offset: 3px; }
  .links a:hover { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Scrutineer</h1>
  <p>An iOS app that checks a used-car listing before you buy it.</p>
  <p class="muted">The site is being built. Nothing to see here yet.</p>
  <hr>
  <div class="links">
    <a href="/legal/">Legal</a> &middot; <a href="mailto:support@usescrutineer.com">support@usescrutineer.com</a>
  </div>
</main>
</body>
</html>
